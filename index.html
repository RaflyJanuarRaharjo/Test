<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Mitra — APO Alfamart</title>
<style>
  :root {
    --red: #D6001C;
    --red-dark: #A30016;
    --ink: #1C1B1F;
    --ink-soft: #5B5A5F;
    --line: #E4E2E6;
    --paper: #FAF9F7;
    --card: #FFFFFF;
    --green: #1E7A3D;
    --green-bg: #E7F5EC;
    --gray: #8A8890;
    --gray-bg: #F1F0EE;
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 28px clamp(20px, 5vw, 56px) 20px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand .mark {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.02em;
    flex-shrink: 0;
  }

  .brand h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .brand p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .search {
    position: relative;
  }

  .search input {
    font-family: var(--sans);
    font-size: 13.5px;
    padding: 9px 12px 9px 34px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    width: 220px;
    color: var(--ink);
  }

  .search input:focus {
    outline: 2px solid var(--red);
    outline-offset: -1px;
    background: var(--card);
  }

  .search svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    stroke: var(--gray);
  }

  button.refresh {
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 500;
    padding: 9px 16px;
    border: none;
    border-radius: 8px;
    background: var(--ink);
    color: white;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button.refresh:hover { background: #000; }
  button.refresh:active { transform: translateY(1px); }
  button.refresh:disabled { opacity: 0.5; cursor: default; }

  main {
    padding: 28px clamp(20px, 5vw, 56px) 60px;
    max-width: 1280px;
    margin: 0 auto;
  }

  .stats {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 18px;
    min-width: 130px;
  }

  .stat .num {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 600;
    line-height: 1;
  }

  .stat .label {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .stat.accent .num { color: var(--red); }

  .table-wrap {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }

  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    background: var(--gray-bg);
  }

  tbody td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #FCFAF8; }

  td.mono { font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); }
  td.name { font-weight: 500; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
  }

  .badge.aktif { background: var(--green-bg); color: var(--green); }
  .badge.tidak { background: var(--gray-bg); color: var(--gray); }

  .badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .state {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .state.error { color: var(--red-dark); }

  .state code {
    display: block;
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 12px;
    background: var(--gray-bg);
    padding: 10px 14px;
    border-radius: 6px;
    max-width: 520px;
    margin-inline: auto;
    word-break: break-all;
  }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: var(--gray);
  }

  @media (max-width: 640px) {
    .search input { width: 150px; }
    .table-wrap { overflow-x: auto; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">A</div>
    <div>
      <h1>Data Mitra APO</h1>
      <p>Sinkron langsung dari Google Sheets</p>
    </div>
  </div>
  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Cari nama, toko, NIK…">
    </div>
    <button class="refresh" id="refreshBtn">Muat ulang</button>
  </div>
</header>

<main>
  <div class="stats" id="stats" style="display:none;">
    <div class="stat">
      <div class="num" id="statTotal">0</div>
      <div class="label">Total mitra</div>
    </div>
    <div class="stat accent">
      <div class="num" id="statAktif">0</div>
      <div class="label">Status aktif</div>
    </div>
  </div>

  <div class="table-wrap">
    <div id="content">
      <div class="state">Memuat data…</div>
    </div>
  </div>
</main>

<footer>Data diambil dari Google Apps Script Web App</footer>

<script>
  // ==================== KONFIGURASI ====================
  // Ganti dua nilai ini sesuai deployment Apps Script kamu.
  const API_URL = 'GANTI_DENGAN_WEB_APP_URL_KAMU'; // contoh: https://script.google.com/macros/s/XXXX/exec
  const API_KEY = 'GANTI_DENGAN_API_KEY_KAMU';       // sama seperti yang diisi di fungsi setup()
  // =======================================================

  let allRows = [];

  const contentEl = document.getElementById('content');
  const statsEl = document.getElementById('stats');
  const statTotal = document.getElementById('statTotal');
  const statAktif = document.getElementById('statAktif');
  const searchInput = document.getElementById('searchInput');
  const refreshBtn = document.getElementById('refreshBtn');

  async function loadData() {
    refreshBtn.disabled = true;
    refreshBtn.textContent = 'Memuat…';
    contentEl.innerHTML = '<div class="state">Memuat data…</div>';
    statsEl.style.display = 'none';

    try {
      const res = await fetch(`${API_URL}?key=${encodeURIComponent(API_KEY)}`);
      const json = await res.json();

      if (json.error) {
        throw new Error(json.error);
      }

      allRows = json.data || [];
      renderStats(allRows);
      renderTable(allRows);
    } catch (err) {
      contentEl.innerHTML = `
        <div class="state error">
          Gagal memuat data. Cek API_URL dan API_KEY di kode.
          <code>${String(err.message || err)}</code>
        </div>`;
    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent = 'Muat ulang';
    }
  }

  function renderStats(rows) {
    const aktif = rows.filter(r => r['Status APO'] === 'Aktif').length;
    statTotal.textContent = rows.length;
    statAktif.textContent = aktif;
    statsEl.style.display = rows.length ? 'flex' : 'none';
  }

  function renderTable(rows) {
    if (!rows.length) {
      contentEl.innerHTML = '<div class="state">Belum ada data mitra masuk.</div>';
      return;
    }

    const cols = ['No', 'Tanggal Input', 'NIK', 'Nama Lengkap', 'Kode Toko', 'Nama Toko', 'Alamat Email Mitra', 'Company', 'Status APO'];

    const rowsHtml = rows.map(r => {
      const status = r['Status APO'] === 'Aktif' ? 'aktif' : 'tidak';
      const tanggal = r['Tanggal Input'] ? new Date(r['Tanggal Input']).toLocaleString('id-ID') : '-';
      return `
        <tr>
          <td class="mono">${r['No'] ?? ''}</td>
          <td class="mono">${tanggal}</td>
          <td class="mono">${r['NIK'] ?? ''}</td>
          <td class="name">${r['Nama Lengkap'] ?? ''}</td>
          <td class="mono">${r['Kode Toko'] ?? ''}</td>
          <td>${r['Nama Toko'] ?? ''}</td>
          <td class="mono">${r['Alamat Email Mitra'] ?? ''}</td>
          <td>${r['Company'] ?? ''}</td>
          <td><span class="badge ${status}">${r['Status APO'] ?? ''}</span></td>
        </tr>`;
    }).join('');

    contentEl.innerHTML = `
      <table>
        <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>`;
  }

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) { renderTable(allRows); return; }
    const filtered = allRows.filter(r =>
      Object.values(r).some(v => String(v).toLowerCase().includes(q))
    );
    renderTable(filtered);
  });

  refreshBtn.addEventListener('click', loadData);

  loadData();
</script>

</body>
</html>
